# =====================================================================
# 关键词库与黑名单 keywords.yaml（文档附录 B.3）
# =====================================================================
export_keywords:
  - 导出
  - 导出Excel
  - 导出 Excel
  - 导出报表
  - 下载
  - 下载报表
  - 生成报表
  - 打印预览并导出

download_done_keywords:
  - 下载完成
  - 已完成
  - 下载完毕
  - 打开
  - 在文件夹中显示

# 危险关键词：扫描阶段命中只记录不点击；执行阶段永不点击
blacklist_keywords:
  - 删除
  - 作废
  - 注销
  - 审核
  - 审批
  - 提交
  - 保存
  - 修改
  - 冲销
  - 退费
  - 结算
  - 确认付款
  - 医嘱下达
  - 清空
  - 重置

# 下载完成提示框内禁止当作业务元素点击的按钮
blacklist_prompt_buttons:
  - 打开
  - 在文件夹中显示
  - 始终打开此类文件
  - 查看

# 返回类关键词（三级回退第一级）
back_keywords:
  - 返回
  - 取消
  - 关闭
  - 收起

# 安全导航词：扫描阶段仅允许点击命中以下语义的入口（查询/报表/统计等
# 只读浏览类）；其余可点元素默认不点，从源头杜绝触发写操作
nav_safe_keywords:
  - 查询
  - 报表
  - 统计
  - 列表
  - 明细
  - 浏览
  - 台账
  - 日报
  - 月报
  - 年报
  - 分析
  - 记录
  - 查询统计
  - 数据查询
  - 综合查询
  - 住院日报

matching:
  fuzzy: true
  min_score: 0.85                  # 模板匹配阈值
  ocr_min_confidence: 0.75
  locate_levels: [ocr, template, manual]   # 三级定位顺序
