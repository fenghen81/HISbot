[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hisbot"
version = "1.0.0"
description = "HIS 离线数据采集自动化工具（外部观察者 + 虚拟操作员，原生 PySide6 GUI）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5",
    "mss>=9.0",
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pandas>=2.0",
    "pdfplumber>=0.11",
    "cryptography>=42.0",
    "watchdog>=3.0",
    "PyYAML>=6.0",
    "APScheduler>=3.10",
    "Pillow>=10.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
linux = ["python-xlib; sys_platform == 'linux'"]
windows = ["pywin32; sys_platform == 'win32'"]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8.0"]

[project.scripts]
hisbot = "hisbot.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# BLE001：自动化工具故意宽泛兜底（已全部带日志）；DTZ：时间统一走 core.util.now_iso
ignore = ["BLE001", "DTZ", "E402", "E702", "UP042"]  # E402:延迟导入; E702/UP042:纯风格,待专项清理

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
ignore_errors = false
warn_unused_ignores = false
# GUI 框架与操作系统 API 无类型存根，单独放行
[[tool.mypy.overrides]]
module = ["hisbot.ui.*", "hisbot.platform.*", "hisbot.simulator.*", "hisbot.execute.human"]
ignore_errors = true
