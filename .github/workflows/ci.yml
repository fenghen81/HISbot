name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -e . pytest ruff mypy PySide6
          pip install python-xlib mss opencv-python-headless
      - name: ruff
        run: ruff check src/
      - name: mypy
        run: mypy src/hisbot
      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q
